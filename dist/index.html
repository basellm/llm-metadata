    <script>
      // 首帧前应用主题，避免闪烁（键名与 ThemeProvider 保持一致）
      (function () {
        try {
          var theme = localStorage.getItem('llm-metadata.theme');
          if (
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
